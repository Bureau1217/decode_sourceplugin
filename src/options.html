<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Source Reliability Database</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="wrap">
      <h1>Source Reliability Database</h1>
      <p>
        This is the dataset the plugin uses to score sources in Google search
        results. To add or edit sources, update
        <code>data/sources.json</code> and reload the extension.
      </p>

      <table id="sourcesTable">
        <thead>
          <tr>
            <th>Source</th>
            <th>Domain</th>
            <th>Trust score</th>
            <th>Explanation</th>
            <th>Agree</th>
            <th>Disagree</th>
          </tr>
        </thead>
        <tbody id="sourcesBody"></tbody>
      </table>
    </div>
    <script src="options.js"></script>
  </body>
</html>
